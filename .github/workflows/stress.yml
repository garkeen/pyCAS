name: stress

on: [push, pull_request]

jobs:
  stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-timeout
      - run: python -m pytest stress/test_stress.py -q
