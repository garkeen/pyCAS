name: stress

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" pytest pytest-timeout
      - name: 静态门禁
        run: |
          python -m mypy --strict cas
          python -m ruff check cas tests
          python -m compileall -q cas
      # 钉子库：确定性单测，失败直接定位到断言
      - name: 钉子库
        run: python -m pytest tests/ -m "not random" -q
      # 随机压力台架：自证性质，全自证无外部真值
      - name: 压力台架
        run: python -m pytest tests/random -q
